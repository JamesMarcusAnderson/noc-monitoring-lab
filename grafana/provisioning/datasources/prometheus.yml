# Grafana datasource provisioning: Prometheus, auto-configured on first boot.
# The dashboard's ${DS_PROMETHEUS} variable resolves to this datasource,
# so the "NOC Overview" dashboard works with zero manual setup.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
